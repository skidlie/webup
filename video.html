<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Gateway Modal -->
    <div id="gateway-modal" class="modal">
        <div class="modal-content">
            <h2>Enter PIN</h2>
            <input type="password" id="pin-input" inputmode="numeric" placeholder="***">
            <button id="pin-submit">Unlock</button>
            <p id="pin-error" class="error-text hidden">Incorrect PIN.</p>
        </div>
    </div>

    <!-- Main Content -->
    <main id="main-content" class="hidden">
        <h1>Video Portal</h1>
        <div id="camera-blocked" class="hidden">
            Camera blocked. Access phone settings for Chrome > Permissions and allow Camera.
        </div>
        <div id="video-container">
            <video id="local-video" autoplay playsinline muted></video>
            <video id="remote-video" autoplay playsinline></video>
        </div>
        <a href="index.html" class="nav-link">Go to File Vault</a>
    </main>

    <script src="js/supabase-config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/webrtc.js"></script>
</body>
</html>
