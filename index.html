<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Vault</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Gateway Modal -->
    <div id="gateway-modal" class="modal">
        <div class="modal-content">
            <h2>Enter PIN</h2>
            <input type="password" id="pin-input" inputmode="numeric" placeholder="***">
            <button id="pin-submit">Unlock</button>
            <p id="pin-error" class="error-text hidden">Incorrect PIN.</p>
        </div>
    </div>

    <!-- Main Content -->
    <main id="main-content" class="hidden">
        <h1>File Vault</h1>
        <input type="file" id="file-input" accept="*/*" multiple>
        <button id="upload-btn">Upload to Vault</button>
        <p id="progress-text" class="hidden"></p>
        <p id="upload-success" class="hidden">✅ Uploaded.</p>
        <a href="video.html" class="nav-link">Go to Video Portal</a>
    </main>

    <script src="js/supabase-config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
